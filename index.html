<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05060a">
  <meta name="description" content="NEXLIX - منصة رياضية وترفيهية لمتابعة المباريات والقنوات والأفلام.">
  <title>NEXLIX | WATCH MORE • LIVE MORE</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: {
        fontFamily: { sans: ['Cairo', 'sans-serif'] },
        colors: { ink:'#05060a', panel:'#0b0d13', card:'#090a10', nav:'#101117', red:'#e50914', cyan:'#16c5de', mint:'#16b981' }
      }}
    };
  </script>
  <style>
    :root { color-scheme: dark; --red:#e50914; --cyan:#16c5de; --safe-bottom:env(safe-area-inset-bottom,0px); --ticker-h:29px; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; scrollbar-width:none; }
    body { margin:0; background:#05060a; color:#fff; font-family:'Cairo',sans-serif; overflow-x:hidden; padding-bottom:calc(88px + var(--safe-bottom)); }
    ::-webkit-scrollbar { display:none; }
    button,input { font:inherit; }
    button:focus-visible,a:focus-visible,input:focus-visible { outline:2px solid #16c5de; outline-offset:3px; }
    .ticker { height:var(--ticker-h); position:fixed; inset:0 0 auto; z-index:60; background:#e50914; overflow:hidden; display:flex; align-items:center; }
    .ticker-track { display:flex; width:max-content; white-space:nowrap; animation: ticker 20s linear infinite; }
    .ticker:hover .ticker-track { animation-play-state:paused; }
    .ticker-group { display:flex; align-items:center; gap:1.6rem; padding-inline:0.9rem; font-size:clamp(11px,2.4vw,13px); font-weight:700; }
    @keyframes ticker { from { transform:translateX(0); } to { transform:translateX(50%); } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; } }
    .brand-mark { width:72px; height:64px; flex:none; filter:drop-shadow(0 5px 9px #0009); }
    .brand-word { font-family:Arial,sans-serif; font-weight:900; letter-spacing:1px; font-size:clamp(37px,9vw,57px); line-height:1; }
    .brand-arc { width:78%; height:20px; border-top:5px solid #e50914; border-radius:100% 100% 0 0; transform:rotate(-5deg); margin:0 4% -3px auto; }
    .hero { background:radial-gradient(ellipse at 50% 0%,#30090d 0%,#100609 34%,#05060a 72%); }
    .hero-copy { color:#c7c7cc; font-size:clamp(17px,4.2vw,21px); line-height:1.9; }
    .btn-red { background:linear-gradient(110deg,#f20b17,#c9000b); box-shadow:0 7px 22px #e5091444,inset 0 1px 0 #ffffff45; }
    .btn-cyan { background:#16c5de; color:#041116; box-shadow:0 6px 20px #16c5de33; }
    .ad-space { min-height:86px; background-color:#fff; background-image:repeating-linear-gradient(45deg,transparent,transparent 13px,#d6eeee 13px,#d6eeee 15px); color:#1264a4; }
    .ad-space span { background:#ffffffdf; }
    .section-heading { background:linear-gradient(110deg,#171922,#090a10); border:1px solid #242630; }
    .match-card { background:#08090f; border:2px solid #20222c; border-radius:15px; box-shadow:0 5px 18px #0004; }
    .match-grid { display:grid; grid-template-columns:1fr 1.2fr 1fr; align-items:center; direction:ltr; gap:4px; }
    .team { min-width:0; direction:rtl; }
    .team-name { font-size:clamp(11px,3vw,15px); font-weight:700; line-height:1.5; }
    .crest { width:49px; height:49px; display:grid; place-items:center; margin:0 auto 7px; border-radius:15px 15px 19px 19px; border:2px solid #4a4d5a; background:linear-gradient(145deg,#202433,#090a10); color:#f4f4f5; font:900 14px Arial,sans-serif; clip-path:polygon(8% 0,92% 0,88% 72%,50% 100%,12% 72%); }
    .crest.red { background:linear-gradient(145deg,#a50b19,#28080e); border-color:#e15b64; }
    .crest.blue { background:linear-gradient(145deg,#174b8c,#07182c); border-color:#6395cb; }
    .crest.gold { background:linear-gradient(145deg,#9a6814,#261a08); border-color:#c9a34c; }
    .crest.green { background:linear-gradient(145deg,#146448,#071b16); border-color:#4caa87; }
    .match-center { direction:rtl; text-align:center; min-width:0; }
    .status { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-width:112px; max-width:100%; padding:5px 9px; border:1px solid #282b37; border-radius:12px; background:#151721; font-size:11px; font-weight:800; white-space:nowrap; }
    .dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
    .live-dot { background:#e50914; animation:pulse 1.2s infinite; }
    @keyframes pulse { 50% { opacity:.35; transform:scale(.8); } }
    .bottom-nav { position:fixed; inset:auto 0 0; z-index:55; background:linear-gradient(180deg,#161820,#090a0f); border-top:1px solid #292b34; padding-bottom:var(--safe-bottom); box-shadow:0 -8px 24px #0008; }
    .nav-grid { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); max-width:570px; margin:auto; min-height:76px; align-items:end; }
    .nav-item { color:#b7bbc6; min-width:0; min-height:65px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:10px; font-weight:700; background:none; border:0; }
    .nav-item i { font-size:23px; }
    .nav-item.active { color:#16a9e8; }
    .nav-home { width:61px; height:61px; border-radius:50%; border:4px solid #b8e9ff; background:linear-gradient(145deg,#20a8ed,#0870c3); color:white; margin-top:-25px; box-shadow:0 0 18px #168fe477; font-size:27px; }
    .page { max-width:570px; margin:0 auto; min-height:70vh; padding-top:var(--ticker-h); }
    .page-pad { padding:16px; }
    .surface { background:#0b0d13; border:1px solid #252833; border-radius:16px; }
    .light-panel { background:#f3f4f6; color:#171923; }
    .search { width:100%; background:#fff; color:#171923; border:1px solid #d1d5db; border-radius:999px; padding:11px 42px 11px 15px; }
    .tile { background:#11141d; border:1px solid #282b36; border-radius:14px; min-height:112px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:12px; }
    .tile i { font-size:30px; color:#16c5de; }
    .movie-poster { aspect-ratio:2/3; width:100%; border-radius:10px; background:linear-gradient(145deg,#33394b,#10131c 55%,#6b1722); display:grid; place-items:center; color:#ffffffb0; font-size:34px; }
    .muted { color:#a6a6ae; }
    .hidden-page { display:none!important; }
    .toast { position:fixed; z-index:100; bottom:calc(100px + var(--safe-bottom)); left:50%; transform:translateX(-50%); background:#20232e; color:white; border:1px solid #444957; border-radius:12px; padding:10px 16px; font-size:13px; box-shadow:0 8px 24px #0008; }
    .scroll-top { position:fixed; z-index:56; left:12px; bottom:calc(96px + var(--safe-bottom)); width:42px; height:42px; border-radius:50%; border:1px solid #2f6d84; background:#0d1a22cc; color:#7dd8ee; display:grid; place-items:center; box-shadow:0 6px 18px #0009; backdrop-filter:blur(6px); }
    .plan-card { background:linear-gradient(170deg,#141826,#090a10 60%); border:1px solid #2a2e3c; border-radius:18px; padding:16px 13px; text-align:center; position:relative; }
    .plan-card.featured { border-color:#16c5de; box-shadow:0 0 0 1px #16c5de44,0 10px 26px #16c5de22; }
    .plan-badge { position:absolute; top:-11px; right:50%; transform:translateX(50%); background:#16c5de; color:#04131a; font-size:10px; font-weight:900; padding:3px 10px; border-radius:999px; white-space:nowrap; }
    .plan-price { font-size:28px; font-weight:900; line-height:1.15; color:#fff; }
    .plan-price small { font-size:12px; font-weight:700; color:#a6a6ae; }
    .field { width:100%; background:#14161f; border:1px solid #2c2f3a; border-radius:10px; padding:10px 12px; color:#fff; font-size:14px; }
    .field:focus { border-color:#16c5de; outline:none; }
    .label { display:block; font-size:11px; font-weight:700; color:#9aa0ad; margin-bottom:5px; }
    .modal { position:fixed; inset:0; z-index:90; display:flex; align-items:flex-end; justify-content:center; background:#000b; backdrop-filter:blur(3px); }
    .modal.hidden { display:none; }
    .modal-sheet { width:100%; max-width:470px; background:#0d0f16; border:1px solid #2a2e3c; border-radius:20px 20px 0 0; padding:18px 16px calc(18px + var(--safe-bottom)); max-height:88vh; overflow-y:auto; }
    @media (min-width:600px) { .page { border-inline:1px solid #161922; } .ticker-group { font-size:13px; } .modal { align-items:center; } .modal-sheet { border-radius:20px; } }
  </style>
</head>
<body>
  <div class="ticker" aria-label="شريط الأخبار">
    <div class="ticker-track" id="tickerTrack">
      <div class="ticker-group"><span>مرحباً بكم في NEXLIX</span><span>WATCH MORE • LIVE MORE</span><span>تابعوا أحدث المباريات والأخبار الرياضية</span></div>
      <div class="ticker-group" aria-hidden="true"><span>مرحباً بكم في NEXLIX</span><span>WATCH MORE • LIVE MORE</span><span>تابعوا أحدث المباريات والأخبار الرياضية</span></div>
    </div>
  </div>

  <main id="app" class="page" aria-live="polite"></main>

  <nav class="bottom-nav" aria-label="التنقل الرئيسي">
    <div class="nav-grid">
      <button class="nav-item" data-page="matches"><i class="fa-solid fa-futbol"></i><span>المباريات</span></button>
      <button class="nav-item" data-page="movies"><i class="fa-solid fa-clapperboard"></i><span>أفلام</span></button>
      <button class="nav-item" data-page="home" aria-label="الرئيسية"><span class="nav-home flex items-center justify-center"><i class="fa-solid fa-house"></i></span><span>الرئيسية</span></button>
      <button class="nav-item" data-page="channels"><i class="fa-solid fa-tv"></i><span>قنوات</span></button>
      <button class="nav-item" data-page="menu"><i class="fa-solid fa-arrow-right-arrow-left"></i><span>القائمة</span></button>
      <button class="nav-item" data-page="subscribe" aria-label="الاشتراك"><i class="fa-solid fa-crown text-amber-400"></i><span>اشتراك</span></button>
    </div>
  </nav>
  <button id="scroll-top" class="scroll-top hidden" data-action="top" aria-label="العودة للأعلى"><i class="fa-solid fa-angles-up"></i></button>
  <div id="plan-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="إتمام الاشتراك">
    <div class="modal-sheet" id="plan-modal-body"></div>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>

  <script>
    /* ══════════════════════════════════════════════════════════════════
       NEXLIX • إعدادات عامة
       ══════════════════════════════════════════════════════════════════ */
    const CONFIG = {
      whatsapp: '201000000000',        // ← رقم واتساب الاشتراكات بالصيغة الدولية (بدون +)
      email: 'contact@nexlix.example', // ← بريد استقبال طلبات الاشتراك
      currency: 'ج.م',
      timezone: 'Africa/Cairo'
    };
    const LEAGUES = [
      {key:'egypt',   name:'مصر',      league:'الدوري المصري الممتاز'},
      {key:'england', name:'إنجلترا',  league:'الدوري الإنجليزي الممتاز'},
      {key:'spain',   name:'إسبانيا',  league:'الدوري الإسباني'},
      {key:'saudi',   name:'السعودية', league:'دوري روشن السعودي'},
      {key:'europe',  name:'أوروبا',   league:'دوري أبطال أوروبا'},
      {key:'italy',   name:'إيطاليا',  league:'الدوري الإيطالي'}
    ];

    /* ══════════════════════════════════════════════════════════════════
       ١) جدول المباريات اليدوي — مباريات اليوم فقط
       عدّل القائمة التالية يدوياً. لا تُعرض مباراة الأمس ولا مباراة الغد:
       تظهر فقط المباريات التي بدون تاريخ أو التي تاريخها = تاريخ اليوم.
       الحقول:  time (24 ساعة) • home • away • leagueKey • status
                score (اختياري مثل "2 - 1") • venue • channel
       status:  upcoming (قادمة) | live (مباشر) | finished (انتهت)
       يمكنك أيضاً الإضافة والحذف من داخل الموقع (يُحفظ ليوم واحد فقط).
       ══════════════════════════════════════════════════════════════════ */
    const MANUAL_MATCHES = [
      { time:'18:00', home:'الأهلي',       away:'الزمالك',  leagueKey:'egypt',   status:'upcoming', venue:'استاد القاهرة الدولي', channel:'قناة رياضية' },
      { time:'20:30', home:'بيراميدز',     away:'المصري',   leagueKey:'egypt',   status:'upcoming', venue:'استاد الدفاع الجوي',  channel:'قناة رياضية' },
      { time:'19:00', home:'مانشستر سيتي', away:'ليفربول',  leagueKey:'england', status:'finished', score:'2 - 1', venue:'ملعب الاتحاد', channel:'قناة رياضية' },
      { time:'21:00', home:'الهلال',       away:'النصر',    leagueKey:'saudi',   status:'live',     score:'1 - 1', venue:'المملكة أرينا', channel:'قناة رياضية' },
      { time:'22:00', home:'ريال مدريد',   away:'برشلونة',  leagueKey:'spain',   status:'upcoming', venue:'سانتياغو برنابيو', channel:'قناة رياضية' }
    ];

    const DAY_TABLE_KEY = 'nexlix_day_table_v1';
    const STATUS_TEXT = { upcoming:'قادمة', soon:'بعد قليل', live:'مباشر', finished:'انتهت' };
    let matches = [];
    let selectedLeague = 'all';
    let selectedFilter = 'all';
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const todayISO = () => new Intl.DateTimeFormat('en-CA',{timeZone:CONFIG.timezone,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
    const todayLabel = () => new Intl.DateTimeFormat('ar-EG',{timeZone:CONFIG.timezone,weekday:'long',day:'numeric',month:'long'}).format(new Date());
    const codeOf = name => {
      const clean = String(name||'').replace(/[\u064B-\u0652\u0640]/g,'').replace(/[^\p{L}\p{N} ]/gu,'').trim();
      const short = clean.replace(/^(ال|Al|El)\s*/i,'');
      return (short || clean || '—').slice(0,3);
    };
    // الجدول المحفوظ يدوياً من داخل الموقع (يُحفظ ليوم واحد فقط ثم يُصفَّر)
    function loadDayTable(){
      try {
        const saved = JSON.parse(localStorage.getItem(DAY_TABLE_KEY)||'null');
        if (saved && saved.date === todayISO() && Array.isArray(saved.items)) return saved.items;
      } catch(_) {}
      return null;
    }
    function saveDayTable(items){
      try { localStorage.setItem(DAY_TABLE_KEY, JSON.stringify({date:todayISO(), items})); return true; }
      catch(_) { toast('تعذر حفظ الجدول في هذا المتصفح.'); return false; }
    }
    function rawToday(){
      const saved = loadDayTable();
      if (saved) return saved;
      const today = todayISO();
      return MANUAL_MATCHES
        .filter(m => !m.date || m.date === today)
        .map((m,i) => Object.assign({}, m, {id: m.id || `seed-${i}`}));
    }
    function buildMatch(raw){
      const home = raw.home || 'الفريق الأول';
      const away = raw.away || 'الفريق الثاني';
      const byKey = LEAGUES.find(l => l.key === raw.leagueKey);
      const league = raw.league || (byKey ? byKey.league : 'بطولة');
      const leagueKey = raw.leagueKey || (LEAGUES.find(l => l.league === league)||{}).key || 'other';
      const status = ['upcoming','soon','live','finished'].includes(raw.status) ? raw.status : 'upcoming';
      const time = raw.time || '';
      const scoreText = raw.score === undefined || raw.score === null ? '' : String(raw.score).trim();
      return {
        id: String(raw.id || `${leagueKey}-${time}-${home}-${away}`),
        home, away,
        homeCode: raw.homeCode || codeOf(home),
        awayCode: raw.awayCode || codeOf(away),
        homeColor: raw.homeColor || 'blue',
        awayColor: raw.awayColor || 'red',
        score: scoreText || time || '—',
        time, status, league, leagueKey,
        venue: raw.venue || 'غير محدد',
        channel: raw.channel || 'غير محدد',
        date: raw.date || todayISO(),
        statusText: raw.eventStatus || STATUS_TEXT[status] || '',
        raw
      };
    }
    const byKickoff = (a,b) => String(a.time||'99:99').localeCompare(String(b.time||'99:99'));
    function matchesForToday(){ return rawToday().map(buildMatch).sort(byKickoff); }
    function emptyMatches(){
      return `<div class="surface p-5 text-center text-sm muted leading-7">لا توجد مباريات مُدخلة ليوم <b class="text-white">${esc(todayLabel())}</b>.<br>أضف مباريات اليوم من زر «إضافة مباراة لليوم».</div>`;
    }
    function visibleMatches(){
      return matches.filter(m => (selectedLeague==='all' || m.leagueKey===selectedLeague) &&
        (selectedFilter==='all' || (selectedFilter==='upcoming' ? ['upcoming','soon'].includes(m.status) : m.status===selectedFilter)));
    }
    function matchesMarkup(){
      const list = visibleMatches();
      return list.length ? list.map(matchCard).join('') : emptyMatches();
    }
    function refreshMatchViews(){
      matches = matchesForToday();
      const list = document.getElementById('match-list'); if(list) list.innerHTML = matchesMarkup();
      const home = document.getElementById('home-match-list'); if(home) home.innerHTML = matches.slice(0,5).map(matchCard).join('') || emptyMatches();
      document.querySelectorAll('[data-match-meta]').forEach(el => {
        el.textContent = `مباريات اليوم • ${todayLabel()} • جدول يدوي • بتوقيت القاهرة`;
      });
      const count = document.getElementById('match-count');
      if(count) count.textContent = `${matches.length} مباراة`;
    }
    function leagueButtons(){
      const used = [...new Map(matches.map(m => [m.leagueKey, m.league])).entries()];
      if(selectedLeague !== 'all' && !used.some(([key]) => key === selectedLeague)) selectedLeague = 'all';
      const chips = [{key:'all', label:'الكل'}, ...used.map(([key,label]) => ({key, label}))];
      return `<div class="flex gap-2 overflow-x-auto pb-3 mb-3">${chips.map(c => `<button class="league-btn shrink-0 rounded-full px-4 py-2 text-sm ${selectedLeague===c.key?'bg-cyan-500 text-black font-bold':'bg-gray-800'}" data-league="${esc(c.key)}">${esc(c.label)}</button>`).join('')}</div>`;
    }

    const channels = [
      {name:'الجزيرة',icon:'fa-globe',color:'#e9b949',category:'أخبار'},
      {name:'القاهرة نيوز',icon:'fa-newspaper',color:'#e5484d',category:'أخبار'},
      {name:'قناة رياضية',icon:'fa-futbol',color:'#16c5de',category:'رياضة'},
      {name:'قناة وثائقية',icon:'fa-earth-africa',color:'#22c55e',category:'وثائقيات'},
      {name:'قناة أطفال',icon:'fa-child',color:'#f59e0b',category:'أطفال'},
      {name:'قناة ترفيه',icon:'fa-tv',color:'#a78bfa',category:'ترفيه'}
    ];
    const movies = [
      {name:'عنوان فيلم تجريبي 1',year:'2026',genre:'أكشن'},
      {name:'عنوان فيلم تجريبي 2',year:'2025',genre:'دراما'},
      {name:'عنوان فيلم تجريبي 3',year:'2024',genre:'خيال علمي'},
      {name:'عنوان فيلم تجريبي 4',year:'2026',genre:'مغامرة'},
      {name:'عنوان فيلم تجريبي 5',year:'2025',genre:'كوميديا'},
      {name:'عنوان فيلم تجريبي 6',year:'2024',genre:'إثارة'}
    ];
    const app = document.getElementById('app');
    let currentPage = 'home';
    let previousPage = 'home';

    function logo() {
      return `<div class="flex flex-col items-center py-5">
        <div class="brand-arc"></div>
        <div class="flex items-center justify-center gap-2" dir="ltr">
          <svg class="brand-mark" viewBox="0 0 100 82" role="img" aria-label="N">
            <defs><linearGradient id="ng" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff4650"/><stop offset=".55" stop-color="#e50914"/><stop offset="1" stop-color="#97000a"/></linearGradient></defs>
            <path d="M12 68 L25 13 Q28 3 37 11 L82 57 L73 75 L30 36 L23 72 Q20 82 10 78 Q5 76 12 68Z" fill="url(#ng)"/>
            <path d="M57 9 L79 20 L82 68 Q82 78 72 76 L60 70Z" fill="url(#ng)"/>
            <path d="M28 38 L46 55 L37 59Z" fill="#fff" opacity=".95"/>
          </svg>
          <div class="brand-word"><span class="text-white">NEX</span><span class="text-red-600">LIX</span></div>
        </div>
        <div class="text-gray-300 tracking-[.22em] text-[10px] sm:text-xs mt-2" dir="ltr">WATCH MORE • LIVE MORE</div>
      </div>`;
    }
    function adSpace() {
      return `<div class="ad-space mx-3 my-5 rounded-sm flex items-center justify-center text-center"><span class="text-2xl sm:text-3xl font-bold px-3 py-1 rounded">(مساحة إعلانية)</span></div>`;
    }
    function statusMarkup(status) {
      const map={live:['مباشر','#e50914','live-dot'],soon:['بعد قليل','#16b981',''],upcoming:['قادمة','#4b8bd8',''],finished:['انتهت','#a6a6ae','']};

        <a class="w-full rounded-xl bg-mint text-black font-extrabold py-3 text-sm flex items-center justify-center gap-2" href="${wa}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp text-lg"></i> إتمام الطلب عبر واتساب</a>
        <a class="w-full mt-2 rounded-xl bg-gray-800 border border-gray-700 py-2.5 text-sm font-bold flex items-center justify-center gap-2" href="${mail}"><i class="fa-regular fa-envelope"></i> إرسال الطلب بالبريد</a>
        <p class="text-[10px] muted mt-3 leading-5 text-center">سيتم تأكيد الطلب وإرسال كود التفعيل بعد الدفع. لم يتم خصم أي مبلغ من هذه الصفحة.</p>`;
      const modal = document.getElementById('plan-modal');
      if(modal) modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }
    function closePlanModal() {
      const modal = document.getElementById('plan-modal');
      if(modal) modal.classList.add('hidden');
      document.body.style.overflow = '';
    }
    function livePage() {
      return `<div class="page-pad"><button class="text-cyan-300 mb-5" data-back><i class="fa-solid fa-arrow-right ml-2"></i>رجوع</button><h1 class="text-2xl font-extrabold mb-4">مشغل البث</h1>
        <div class="aspect-video rounded-2xl border border-gray-700 bg-black flex flex-col items-center justify-center text-center p-5"><i class="fa-solid fa-circle-play text-5xl text-gray-500 mb-3"></i><b>لا يتوفر مصدر بث حالياً</b><span class="text-xs muted mt-2">أضف رابط HLS أو مصدر فيديو تملك حق استخدامه لتفعيل المشغل.</span></div>
        <button class="w-full rounded-xl bg-cyan-500 text-black font-extrabold py-3 mt-4" data-share><i class="fa-solid fa-share-nodes ml-2"></i>مشاركة الصفحة</button></div>`;
    }
    function render(page, options={}) {
      if (!options.detail) { previousPage = currentPage; currentPage = page; }
      closePlanModal();
      matches = matchesForToday();
      const pages = {home:homePage,matches:matchesPage,channels:channelsPage,movies:moviesPage,menu:menuPage,live:livePage,subscribe:subscribePage};
      app.innerHTML = options.detail ? detailsPage(options.id) : (pages[page] || homePage)();
      document.querySelectorAll('.nav-item[data-page]').forEach(b=>b.classList.toggle('active', b.dataset.page===currentPage));
      refreshMatchViews();
      updateScrollTop();
      window.scrollTo({top:0,behavior:'smooth'});
      history.replaceState({page:currentPage},'', page==='home'?'#home':'#'+page);
    }
    function updateScrollTop(){
      const el = document.getElementById('scroll-top');
      if(el) el.classList.toggle('hidden', window.scrollY < 320);
    }
    function toast(message) {
      const el=document.getElementById('toast'); el.textContent=message; el.classList.remove('hidden');
      clearTimeout(toast.timer); toast.timer=setTimeout(()=>el.classList.add('hidden'),2600);
    }
    document.addEventListener('click', async e=>{
      if(e.target.id === 'plan-modal'){ closePlanModal(); return; }
      if(e.target.closest('#plan-modal-close')){ closePlanModal(); return; }
      const planBtn=e.target.closest('[data-plan]');
      if(planBtn){ openPlanModal(planBtn.dataset.plan); return; }
      const pageBtn=e.target.closest('[data-page]');
      if(pageBtn){ render(pageBtn.dataset.page); return; }
      if(e.target.closest('[data-action="top"]')){ window.scrollTo({top:0,behavior:'smooth'}); return; }
      const matchBtn=e.target.closest('[data-match]');
      if(matchBtn){ previousPage=currentPage; render(currentPage,{detail:true,id:matchBtn.dataset.match}); return; }
      if(e.target.closest('#toggle-editor')){
        const form=document.getElementById('match-form');
        if(form){ form.classList.toggle('hidden'); if(!form.classList.contains('hidden')) document.getElementById('mf-home')?.focus(); }
        return;
      }
      if(e.target.closest('#clear-day')){
        if(!rawToday().length){ toast('جدول اليوم فارغ بالفعل.'); return; }
        if(window.confirm('مسح كل مباريات اليوم؟')){ saveDayTable([]); render('matches'); toast('تم مسح جدول اليوم.'); }
        return;
      }
      const delBtn=e.target.closest('[data-del-match]');
      if(delBtn){
        const id=String(delBtn.dataset.delMatch);
        saveDayTable(rawToday().filter(m=>String(m.id)!==id));
        render('matches'); toast('تم حذف المباراة من جدول اليوم.');
        return;
      }
      const leagueBtn=e.target.closest('[data-league]');
      if(leagueBtn){selectedLeague=leagueBtn.dataset.league;render('matches');return;}
      const filter=e.target.closest('[data-filter]');
      if(filter){selectedFilter=filter.dataset.filter;render('matches');return;}
      const cat=e.target.closest('[data-category]');
      if(cat){
        document.querySelectorAll('.category-btn').forEach(b=>b.className='category-btn shrink-0 rounded-full px-4 py-2 bg-gray-800 text-sm');
        cat.className='category-btn shrink-0 rounded-full px-4 py-2 bg-cyan-600 text-black text-sm font-bold';
        const category=cat.dataset.category, q=(document.getElementById('channel-search')?.value||'').trim();
        const list=channels.filter(c=>(category==='الكل'||c.category===category)&&c.name.includes(q));
        document.getElementById('channel-grid').innerHTML=channelTiles(list); return;
      }
      if(e.target.closest('[data-channel]')){ const c=channels[Number(e.target.closest('[data-channel]').dataset.channel)]; toast(`تفاصيل ${c.name}: لا يوجد مصدر بث مضاف حالياً.`); return; }
      if(e.target.closest('[data-movie]')){ const m=movies[Number(e.target.closest('[data-movie]').dataset.movie)]; toast(`${m.name} — بيانات تجريبية، لا يوجد رابط مشاهدة.`); return; }
      if(e.target.closest('[data-back]')){ render(previousPage); return; }
      if(e.target.closest('[data-share]')){
        if(navigator.share){ try{await navigator.share({title:'NEXLIX',url:location.href});}catch(_){} }
        else if(navigator.clipboard){ await navigator.clipboard.writeText(location.href); toast('تم نسخ رابط الصفحة.'); }
        else toast('يمكنك نسخ رابط الصفحة من شريط العنوان.'); return;
      }
    });
    document.addEventListener('input',e=>{
      if(e.target.id==='channel-search'){
        const q=e.target.value.trim().toLowerCase();
        document.getElementById('channel-grid').innerHTML=channelTiles(channels.filter(c=>c.name.toLowerCase().includes(q)));
      }
      if(e.target.id==='movie-search'){
        const q=e.target.value.trim().toLowerCase();
        document.getElementById('movie-grid').innerHTML=movieTiles(movies.filter(m=>m.name.toLowerCase().includes(q)));
      }
    });
    document.addEventListener('submit', e=>{
      if(e.target.id !== 'match-form') return;
      e.preventDefault();
      const val = id => (document.getElementById(id)?.value || '').trim();
      const home = val('mf-home'), away = val('mf-away'), time = val('mf-time');
      if(!home || !away){ toast('أدخل اسم الفريقين أولاً.'); return; }
      if(home === away){ toast('لا يمكن أن يكون الفريقان متطابقين.'); return; }
      if(!time){ toast('أدخل موعد المباراة.'); return; }
      const list = rawToday().slice();
      list.push({
        id: `m-${Date.now()}`,
        time,
        home, away,
        leagueKey: val('mf-league') || 'egypt',
        status: val('mf-status') || 'upcoming',
        score: val('mf-score'),
        venue: val('mf-venue') || 'غير محدد',
        channel: val('mf-channel') || 'غير محدد'
      });
      if(!saveDayTable(list)) return;
      render('matches');
      toast('تمت إضافة المباراة إلى جدول اليوم.');
    });
    document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closePlanModal(); });
    window.addEventListener('scroll', updateScrollTop, {passive:true});
    window.addEventListener('popstate',()=>render((location.hash||'#home').slice(1)));
    matches = matchesForToday();
    let activeDay = todayISO();
    // عند منتصف الليل يتغيّر اليوم تلقائياً فلا تبقى مباريات الأمس ظاهرة
    setInterval(()=>{
      const now = todayISO();
      if(now !== activeDay){
        activeDay = now;
        if(['home','matches'].includes(currentPage)) render(currentPage); else refreshMatchViews();
      }
    }, 60 * 1000);
    const initial = (location.hash || '#home').slice(1);
    render(['home','matches','channels','movies','menu','subscribe','live'].includes(initial) ? initial : 'home');
  </script>
</body>
</html>
